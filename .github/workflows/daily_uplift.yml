name: Daily Uplift Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Runs at midnight UTC every day
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Required so GitHub Actions can commit refreshed data back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Uplift Pipeline & Evaluate Metrics
        run: python pipeline.py

      - name: Upload Scored Data & Metrics as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scored-customers-data
          path: |
            scored_customers.csv
            model_metrics.json

      - name: Auto-Commit Updated Scores & Metrics to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scored_customers.csv model_metrics.json
          git diff --staged --quiet || git commit -m "chore(pipeline): automated daily uplift scoring and metric update"
          git push